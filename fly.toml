# fly.toml – Konfiguration für den Fly.io Deploy
# App-Namen vor dem ersten Deploy anpassen (muss global eindeutig sein),
# z.B. per: fly apps create betriebskosten-ki-<dein-suffix>

app = "betriebskosten-ki"
primary_region = "fra"

[build]

[env]
  NODE_ENV = "production"
  DATA_DIR = "/data"
  PORT = "3000"

[[mounts]]
  source = "betriebskosten_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
